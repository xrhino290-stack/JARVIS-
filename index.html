<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S. Orb</title>
<style>
:root{--c:40,170,255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#03070b;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:rgb(var(--c));letter-spacing:3px;font-size:12px}
button{margin-top:12px;background:transparent;color:rgb(var(--c));border:1px solid rgb(var(--c));padding:10px 22px;letter-spacing:3px;font-size:12px;border-radius:2px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui"><div id="st">STANDBY</div><button id="mic">ENABLE MIC</button></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),root=document.documentElement;
let W,H,R,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);R=Math.min(W*0.46,H*0.36)}
addEventListener('resize',size);size();

const N=2600,P=[];
for(let i=0;i<N;i++){
  const u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u),q=Math.random();
  let r,fy=1;
  if(q<0.45){r=0.9+Math.random()*0.1;fy=0.45}      // flat outer ring
  else if(q<0.7){r=0.9+Math.random()*0.1}           // spherical shell
  else if(q<0.9){r=0.45+Math.random()*0.3}          // inner layer
  else{r=Math.random()*0.25}                         // bright core
  P.push({x:s*Math.cos(a)*r,y:u*r*fy,z:s*Math.sin(a)*r,r,streak:Math.random()<0.3,ph:Math.random()*6.28,core:q>=0.9});
}

// neuron network
const NODES=P.filter(p=>!p.streak&&p.r>0.4).slice(0,150),E=[];
NODES.forEach((a,i)=>{
  const d=NODES.map((b,j)=>[j,(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2]).filter(o=>o[0]!==i).sort((m,n)=>m[1]-n[1]).slice(0,3);
  d.forEach(o=>{if(!E.some(e=>(e[0]===i&&e[1]===o[0])||(e[0]===o[0]&&e[1]===i)))E.push([i,o[0],Math.random()])});
});
function proj(p,ca,sa,ct,stl,cx,cy){
  const x1=p.x*ca+p.z*sa,z1=-p.x*sa+p.z*ca,y1=p.y*ct-z1*stl,z2=p.y*stl+z1*ct,k=3/(3-z2);
  return [cx+x1*R*k,cy+y1*R*k,z2,k];
}

const BLUE=[40,170,255],ORG=[255,140,20];
let t=0,ang=0,level=0,target=0,listenUntil=0,manual=false,analyser=null,buf=null;

const st=document.getElementById('st'),mic=document.getElementById('mic');
mic.onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    analyser=ac.createAnalyser();analyser.fftSize=512;
    ac.createMediaStreamSource(s).connect(analyser);
    buf=new Uint8Array(analyser.fftSize);
    mic.style.display='none';
  }catch(e){mic.textContent='MIC BLOCKED - HOLD SCREEN';}
};
addEventListener('pointerdown',e=>{if(e.target!==mic)manual=true});
addEventListener('pointerup',()=>manual=false);

function read(){
  let v=0;
  if(analyser){analyser.getByteTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++){const d=(buf[i]-128)/128;sum+=d*d}v=Math.sqrt(sum/buf.length)*4}
  if(manual)v=Math.max(v,0.5+0.3*Math.sin(performance.now()/90));
  return Math.min(v,1);
}

function frame(now){
  const raw=read();
  if(raw>0.12)listenUntil=now+700;
  const listening=now<listenUntil;
  target=listening?1:0;
  t+=(target-t)*0.08;
  level+=((listening?raw:0)-level)*0.2;
  const rgb=BLUE.map((b,i)=>Math.round(b+(ORG[i]-b)*t)).join(',');
  root.style.setProperty('--c',rgb);
  st.textContent=listening?'LISTENING...':'STANDBY';

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(3,7,11,0.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  ang+=0.003+t*0.005;
  const cx=W/2,cy=H*0.42,ca=Math.cos(ang),sa=Math.sin(ang),tl=0.55,ct=Math.cos(tl),stl=Math.sin(tl);
  const pulse=1;

  // core glow
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.38);
  g.addColorStop(0,`rgba(${rgb},0.55)`);g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*0.7,0,6.28);ctx.fill();

  ctx.strokeStyle=ctx.fillStyle=`rgb(${rgb})`;ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    const p=P[i];
    const wob=1;
    let x=p.x*wob*pulse,y=p.y*wob*pulse,z=p.z*wob*pulse;
    let x1=x*ca+z*sa,z1=-x*sa+z*ca;
    let y1=y*ct-z1*stl,z2=y*stl+z1*ct;
    const k=3/(3-z2),sx=cx+x1*R*k,sy=cy+y1*R*k;
    const a=Math.max(0.12,(z2+1.2)/2.2)*(p.core?1:0.9)*(0.7+0.3*Math.sin(now/300+p.ph));
    ctx.globalAlpha=Math.min(a,1);
    if(p.streak){
      const l=Math.hypot(x1,y1)||1,dx=-y1/l*7*k,dy=x1/l*7*k;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+dx,sy+dy);ctx.stroke();
    }else{
      const sz=(p.core?2.2:1.3)*k;
      ctx.fillRect(sx,sy,sz,sz);
    }
  }

  // neuron connections
  ctx.lineWidth=0.8;
  const pr=NODES.map(n=>proj(n,ca,sa,ct,stl,cx,cy));
  for(const e of E){
    const A=pr[e[0]],B=pr[e[1]],dp=(A[2]+B[2])/2;
    ctx.globalAlpha=Math.max(0.05,(dp+1.2)/2.2)*(0.25+0.35*t);
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
    const f=((now/(1400-300*t)+e[2])%1);
    ctx.globalAlpha=Math.min(1,0.5+0.5*t);
    ctx.fillRect(A[0]+(B[0]-A[0])*f-1.5,A[1]+(B[1]-A[1])*f-1.5,3,3);
  }
  ctx.fillStyle=`rgb(${rgb})`;
  for(const A of pr){ctx.globalAlpha=0.9;ctx.beginPath();ctx.arc(A[0],A[1],2*A[3],0,6.28);ctx.fill()}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
