<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S. Orb</title>
<style>
:root{--c:40,170,255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#03070b;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.bar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:46%;height:14px;border:1px solid rgba(var(--c),.7);background:linear-gradient(90deg,rgba(var(--c),.8) 0 28%,transparent 28%)}
.bar2{position:fixed;left:0;top:30%;width:22%;height:2px;background:rgba(var(--c),.8)}
.vl{position:fixed;right:10px;top:12%;bottom:30%;width:2px;background:rgba(var(--c),.6)}
.box{position:fixed;right:12%;top:26%;width:20%;height:32%;border:1px solid rgba(var(--c),.25);border-left:none}
.ui{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:rgb(var(--c));letter-spacing:3px;font-size:12px}
button{margin-top:12px;background:transparent;color:rgb(var(--c));border:1px solid rgb(var(--c));padding:10px 22px;letter-spacing:3px;font-size:12px;border-radius:2px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar"></div><div class="bar2"></div><div class="vl"></div><div class="box"></div>
<div class="ui"><div id="rp" style="margin:0 20px 14px;letter-spacing:1px;font-size:13px;line-height:1.4;min-height:18px"></div><div id="st">STANDBY</div><button id="mic">ENABLE MIC</button></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),root=document.documentElement;
let W,H,R,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);R=Math.min(W*0.46,H*0.36)}
addEventListener('resize',size);size();

const N=2600,P=[];
for(let i=0;i<N;i++){
  const u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u),q=Math.random();
  let r,fy=1;
  if(q<0.45){r=0.9+Math.random()*0.1;fy=0.45}
  else if(q<0.7){r=0.9+Math.random()*0.1}
  else if(q<0.9){r=0.45+Math.random()*0.3}
  else{r=Math.random()*0.25}
  P.push({x:s*Math.cos(a)*r,y:u*r*fy,z:s*Math.sin(a)*r,r,streak:Math.random()<0.3,ph:Math.random()*6.28,core:q>=0.9});
}

const BLUE=[40,170,255],ORG=[255,140,20];
let t=0,ang=0,level=0,target=0;

const WORKER_URL='https://YOUR-WORKER.workers.dev';
const st=document.getElementById('st'),mic=document.getElementById('mic'),rp=document.getElementById('rp');
const voice={listening:false,msg:'STANDBY'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let history=[];
mic.textContent='TAP TO TALK';
mic.onclick=()=>{
  if(!SR){voice.msg='USE CHROME BROWSER';return}
  speechSynthesis.cancel();
  const rec=new SR();rec.lang='hi-IN';rec.interimResults=false;
  rec.onstart=()=>{voice.listening=true;voice.msg='LISTENING...'};
  rec.onend=()=>{voice.listening=false;if(voice.msg==='LISTENING...')voice.msg='STANDBY'};
  rec.onerror=e=>{voice.listening=false;voice.msg='ERROR: '+e.error};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.start();
};
async function ask(text){
  voice.msg='THINKING...';rp.textContent='"'+text+'"';
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});
    const d=await r.json();
    const reply=d.reply||'Sorry sir, jawab nahi mila.';
    history.push({role:'user',text},{role:'model',text:reply});history=history.slice(-12);
    rp.textContent=reply;speak(reply);
  }catch(e){voice.msg='NETWORK ERROR'}
}
function speak(t){
  const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';
  u.onstart=()=>voice.msg='SPEAKING...';u.onend=()=>voice.msg='STANDBY';
  speechSynthesis.speak(u);
}

function frame(now){
  const listening=voice.listening;
  target=listening?1:0;
  t+=(target-t)*0.08;
  const rgb=BLUE.map((b,i)=>Math.round(b+(ORG[i]-b)*t)).join(',');
  root.style.setProperty('--c',rgb);
  st.textContent=voice.msg;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(3,7,11,0.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  ang+=0.003+t*0.01;
  const cx=W/2,cy=H*0.42,ca=Math.cos(ang),sa=Math.sin(ang),tl=0.55,ct=Math.cos(tl),stl=Math.sin(tl);

  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.38);
  g.addColorStop(0,`rgba(${rgb},0.55)`);g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*0.7,0,6.28);ctx.fill();

  ctx.strokeStyle=ctx.fillStyle=`rgb(${rgb})`;ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    const p=P[i];
    let x=p.x,y=p.y,z=p.z;
    let x1=x*ca+z*sa,z1=-x*sa+z*ca;
    let y1=y*ct-z1*stl,z2=y*stl+z1*ct;
    const k=3/(3-z2),sx=cx+x1*R*k,sy=cy+y1*R*k;
    const a=Math.max(0.12,(z2+1.2)/2.2)*(p.core?1:0.9)*(0.7+0.3*Math.sin(now/300+p.ph));
    ctx.globalAlpha=Math.min(a,1);
    if(p.streak){
      const l=Math.hypot(x1,y1)||1,dx=-y1/l*7*k,dy=x1/l*7*k;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+dx,sy+dy);ctx.stroke();
    }else{
      const sz=(p.core?2.2:1.3)*k;
      ctx.fillRect(sx,sy,sz,sz);
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
  </html>
